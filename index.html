<script>(()=>{const r=document.documentElement,o=document.getElementById('siteMenuOpenBtn'),c=document.getElementById('siteMenuCloseBtn'),m=document.getElementById('siteSideMenu'),v=document.getElementById('siteMenuOverlay'),h=document.getElementById('siteHelpButton'),hm=document.getElementById('siteHelpModal'),hc=hm.querySelector('.neet-help-close'),t=document.getElementById('siteThemeToggle');const close=()=>{m.classList.remove('open');v.classList.remove('open')};o.onclick=()=>{m.classList.add('open');v.classList.add('open')};c.onclick=v.onclick=close;h.onclick=()=>{close();hm.classList.add('open')};hc.onclick=()=>hm.classList.remove('open');const saved=localStorage.getItem('neet-note-theme');if(saved)r.dataset.theme=saved;t.onclick=()=>{const n=r.dataset.theme==='dark'?'light':'dark';r.dataset.theme=n;localStorage.setItem('neet-note-theme',n)}})();</script></body></html>
