<script src="script.js?v=20"></script><script>const qs=s=>document.querySelector(s);function syncHero(){const k=qs('#keySelect')?.value||'C',s=qs('#scaleSelect')?.value||'';qs('#scaleHeroTitle').textContent=`${k} ${s}`;document.querySelectorAll('[data-inst]').forEach(b=>b.classList.toggle('active',b.dataset.inst===qs('#instrumentSelect').value))}['keySelect','scaleSelect','genreSelect','instrumentSelect'].forEach(id=>qs('#'+id)?.addEventListener('change',()=>setTimeout(syncHero,0)));document.querySelectorAll('[data-inst]').forEach(b=>b.addEventListener('click',()=>{qs('#instrumentSelect').value=b.dataset.inst;qs('#instrumentSelect').dispatchEvent(new Event('change',{bubbles:true}))}));const openGuide=()=>location.href='scale-guide.html?scale='+encodeURIComponent(qs('#scaleSelect').value)+'&key='+encodeURIComponent(qs('#keySelect').value);qs('#theoryBtn').addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();openGuide()},true);qs('#mobileTheoryBtn').onclick=openGuide;const sheet=qs('#mobileInstrumentSheet');qs('#mobileInstrumentBtn').onclick=()=>sheet.hidden=false;sheet.querySelector('.sheet-bg').onclick=()=>sheet.hidden=true;sheet.querySelectorAll('[data-mobile-inst]').forEach(b=>b.onclick=()=>{qs('#instrumentSelect').value=b.dataset.mobileInst;qs('#instrumentSelect').dispatchEvent(new Event('change',{bubbles:true}));sheet.hidden=true});setTimeout(syncHero,0);</script><script src="neet-menu-restore.js?v=20260817-2"></script>
