<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スケール指板ビューア</title>
<link rel="stylesheet" href="style.css">
<style>
.site-menu-button{position:fixed;top:14px;left:14px;z-index:10001;display:grid;place-items:center;width:42px;height:42px;padding:0;border:1px solid rgba(0,0,0,.14);border-radius:12px;background:rgba(255,255,255,.94);color:#1f2937;font-size:1.35rem;box-shadow:0 6px 18px rgba(0,0,0,.12);cursor:pointer}.site-menu-overlay{position:fixed;inset:0;z-index:9998;background:rgba(17,24,39,.42);opacity:0;visibility:hidden;pointer-events:none;transition:.2s}.site-menu-overlay.open{opacity:1;visibility:visible;pointer-events:auto}.site-side-menu{position:fixed;top:0;left:0;z-index:9999;width:min(82vw,300px);height:100dvh;padding:24px 18px;background:#fff;box-shadow:14px 0 34px rgba(0,0,0,.2);transform:translateX(-110%);visibility:hidden;transition:.22s;box-sizing:border-box;text-align:left}.site-side-menu.open{transform:none;visibility:visible}.site-side-menu-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.site-side-menu-head h2{margin:0;font-size:1.15rem}.site-menu-close{width:36px;height:36px;border:0;border-radius:10px;background:#f1f1f1;font-size:1.3rem}.site-menu-link{display:flex;align-items:center;gap:12px;width:100%;padding:14px 12px;margin-bottom:8px;border-radius:12px;color:#1f2937;text-decoration:none;font-weight:700;box-sizing:border-box}.site-menu-link:hover,.site-menu-link.current{background:#dfeaf5}.site-menu-icon{width:28px;text-align:center}.instrument-label select{font-weight:800;border-color:#8b6f47}.instrument-badge{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:7px 11px;border-radius:999px;background:#eef3f8;font-weight:700;font-size:.86rem}@media(max-width:680px){.site-menu-button{top:10px;left:10px;width:38px;height:38px}}
</style>
</head>
<body>
<div id="siteMenuOverlay" class="site-menu-overlay"></div><nav id="siteSideMenu" class="site-side-menu" aria-hidden="true"><div class="site-side-menu-head"><h2>メニュー</h2><button id="siteMenuCloseBtn" class="site-menu-close">×</button></div><a class="site-menu-link" href="https://akito0802.github.io/NEET-note/"><span class="site-menu-icon">📝</span>ノート</a><a class="site-menu-link" href="https://akito0802.github.io/scale/"><span class="site-menu-icon">🎸</span>スケール</a><a class="site-menu-link current" href="./"><span class="site-menu-icon">🎵</span>指板</a><a class="site-menu-link" href="https://akito0802.github.io/Cordhyo-/theory.html"><span class="site-menu-icon">📚</span>理論</a></nav><button id="siteMenuOpenBtn" class="site-menu-button">☰</button>
<header><h1>スケール指板ビューア</h1><div class="controls">
<label class="instrument-label">楽器<select id="instrumentSelect"><option value="guitar">🎸 ギター</option><option value="bass">🎸 ベース</option><option value="ukulele">🪕 ウクレレ</option><option value="piano">🎹 ピアノ</option></select></label>
<label>キー<select id="keySelect"></select></label><label>ジャンル<select id="genreSelect"></select></label><label>スケール<select id="scaleSelect"></select></label><label>表示<select id="displayMode"><option value="dots">● ドット</option><option value="notes">♪ 音名</option><option value="degrees">度数</option></select></label><button id="downloadBtn">画像を保存（PNG）</button><button id="theoryBtn">説明</button></div><div id="instrumentBadge" class="instrument-badge"></div>
<div class="tension-panel"><div class="tension-title">テンション追加：</div><div class="tension-list"><label><input type="checkbox" class="tension" value="b9"> b9</label><label><input type="checkbox" class="tension" value="9"> 9</label><label><input type="checkbox" class="tension" value="#9"> #9</label><label><input type="checkbox" class="tension" value="11"> 11</label><label><input type="checkbox" class="tension" value="#11"> #11</label><label><input type="checkbox" class="tension" value="b13"> b13</label><label><input type="checkbox" class="tension" value="13"> 13</label></div><div class="tension-actions"><button id="tensionClearBtn">クリア</button></div></div></header>
<main><div id="fretboardWrapper"><svg id="fretboard" xmlns="http://www.w3.org/2000/svg"></svg><div class="hint">※表示をタップで全画面（もう一度タップで閉じる）</div></div><section id="tableSection"><h2>構成音（1オクターブ）</h2><div id="scaleTable"></div></section></main>
<footer><p id="instrumentInfo">標準チューニング E A D G B E / 12フレット / スマホ対応</p></footer><div id="zoomOverlay" hidden><div id="zoomStage"></div><div id="zoomInfoLabel"></div></div>
<div id="theoryModal" hidden><div class="theory-dialog"><div class="theory-header"><h3>スケールの説明</h3><button id="theoryClose">×</button></div><div id="theoryBody" class="theory-body"></div></div></div>
<script src="script.js?v=17"></script>
<script>(()=>{const o=document.getElementById('siteMenuOpenBtn'),c=document.getElementById('siteMenuCloseBtn'),m=document.getElementById('siteSideMenu'),v=document.getElementById('siteMenuOverlay');const open=()=>{m.classList.add('open');v.classList.add('open')},close=()=>{m.classList.remove('open');v.classList.remove('open')};o.onclick=open;c.onclick=v.onclick=close})();</script>
</body></html>
