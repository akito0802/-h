<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スケール詳説 | NEET NOTE</title><style>*{box-sizing:border-box}body{margin:0;background:#d9c7a8;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.wrap{width:min(760px,calc(100% - 20px));margin:18px auto}.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}.back{color:#5f4b31;text-decoration:none;font-weight:800;background:#fffdf8;border:1px solid #ded6c9;border-radius:12px;padding:10px 13px}.card{background:#fffdf8;border:1px solid #ded6c9;border-radius:20px;padding:20px;box-shadow:0 10px 28px rgba(70,50,25,.08)}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.12em;color:#8b6f47}h1{font-size:1.55rem;margin:5px 0 5px}.key{color:#71695f;margin:0 0 16px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0}.tabs button{border:1px solid #ded6c9;border-radius:12px;background:#fff;padding:11px 7px;font-weight:800}.tabs button.on{background:#efe5d6;border-color:#b9a17d}.body{border-top:1px solid #e8e1d7;padding-top:15px;line-height:1.85;font-size:.94rem}.body h2{font-size:1.05rem;margin:0 0 8px}.body p{margin:0}.note{margin-top:14px;padding:11px 12px;border-radius:12px;background:#f5efe6;color:#675744;font-size:.82rem;line-height:1.65}@media(max-width:520px){.card{padding:16px}.tabs{grid-template-columns:1fr}.tabs button{text-align:left}}</style></head><body><main class="wrap"><div class="top"><a class="back" href="./">← 指板へ戻る</a></div><article class="card"><div class="eyebrow">SCALE GUIDE</div><h1 id="title">スケール詳説</h1><p id="key" class="key"></p><div class="tabs"><button class="on" data-tab="structure">構造</button><button data-tab="sound">響き・和声</button><button data-tab="practice">使い方・練習</button></div><div id="body" class="body"></div><div class="note">※名称や文化的な由来が資料ごとに揺れる音階は、指板ビューアに登録されている音程構造を基準に説明しているよ。</div></article></main><script src="scale-guide-data.js?v=1"></script><script>const q=new URLSearchParams(location.search),scale=q.get('scale')||'メジャー（Ionian）',key=q.get('key')||'C';document.getElementById('title').textContent=scale;document.getElementById('key').textContent=key+' を主音として表示';const d=window.getScaleGuide(scale);function pick(tab){const map={structure:d.structure,sound:d.sound,practice:d.practice};document.getElementById('body').innerHTML='<h2>'+({structure:'スケールの構造',sound:'響きと和声',practice:'実践での使い方'}[tab])+'</h2><p>'+map[tab]+'</p>'}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('on'));b.classList.add('on');pick(b.dataset.tab)});pick('structure');</script></body></html>
